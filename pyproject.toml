[project]
name = "cellfill"
version = "0.1.0"
description = "Code for work on the Paradigm Cell Filling Problem."
authors = [
    {name = "Nils P. Kujath",email = "63961429+NilsKujath@users.noreply.github.com"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "numpy (>=2.5.3,<3.0.0)",
    "pandas (>=3.0.6,<4.0.0)"
]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
mypy = "^2.4.0"
pandas-stubs = "^3.0.5.260914"
black = "^26.10.0"

[tool.mypy]
strict = true